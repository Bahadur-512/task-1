<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">

        <div class="form-box">

            <h1>Create Account</h1>
            <p class="subtitle">Register your account by filling the form below.</p>

            <form>

                <div class="form-row">

                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text"
                               id="fullname"
                               placeholder="Enter your full name"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text"
                               id="username"
                               placeholder="Enter your username"
                               required>
                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email"
                               id="email"
                               placeholder="Enter your email"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel"
                               id="phone"
                               placeholder="Enter your phone number"
                               required>
                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password"
                               id="password"
                               placeholder="Create a password"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <input type="password"
                               id="confirm-password"
                               placeholder="Confirm your password"
                               required>
                    </div>

                </div>


                <div class="gender-section">

                    <label>Gender</label>

                    <div class="gender-options">

                        <label>
                            <input type="radio"
                                   name="gender"
                                   value="male">
                            Male
                        </label>

                        <label>
                            <input type="radio"
                                   name="gender"
                                   value="female">
                            Female
                        </label>

                        <label>
                            <input type="radio"
                                   name="gender"
                                   value="prefer not to say">
                            Prefer not to say
                        </label>

                    </div>

                </div>

                <button type="submit">
                    Create Account
                </button>

            </form>

        </div>

    </div>

</body>

</html>
